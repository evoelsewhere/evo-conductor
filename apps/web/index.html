<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evo Conductor</title>
    <script>
      (() => {
        const stored = localStorage.getItem("conductor.theme");
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const dark = stored === "dark" || (!stored && prefersDark) || stored === "system" && prefersDark;
        document.documentElement.classList.toggle("dark", stored ? stored === "dark" || (stored === "system" && prefersDark) : true);
        document.documentElement.classList.toggle("light", !document.documentElement.classList.contains("dark"));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
