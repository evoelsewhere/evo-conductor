<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#191918" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f8fb" media="(prefers-color-scheme: light)" />
    <meta
      name="description"
      content="Evo Conductor — central control plane for EvoFlux agents, skills and MCP servers."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Evo Conductor</title>
    <!-- Resolve the theme before first paint so there is no flash of the wrong palette. -->
    <script>
      (() => {
        const stored = localStorage.getItem("conductor.theme");
        const mode =
          stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : "system";
        const dark =
          mode === "dark" ||
          (mode === "system" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        const root = document.documentElement;
        root.classList.toggle("dark", dark);
        root.classList.toggle("light", !dark);
        root.style.colorScheme = dark ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
