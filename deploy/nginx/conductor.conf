# Reverse proxy for evo-conductor. Sized for the 100,000-connection profile in
# .env.example — scale down with CONDUCTOR_REALTIME_MAX_CONNECTIONS.
#
# nginx rejects global directives in a per-site file, so copy these into the
# main nginx.conf. Without them nginx's own limits cap connections regardless
# of how high Conductor is configured:
#
# worker_rlimit_nofile 131072;   # match systemd LimitNOFILE / docker ulimit
#
# events {
#     # One client-side plus one upstream-side connection per proxied stream.
#     worker_connections 16384;
#     multi_accept on;
# }

upstream conductor {
    server 127.0.0.1:4700;
    # Without this, every stream opens a new upstream connection and exhausts
    # ephemeral ports between nginx and Conductor.
    keepalive 256;
}

server {
    listen 443 ssl http2;
    server_name conductor.example.com;

    ssl_certificate     /etc/ssl/certs/conductor.example.com.crt;
    ssl_certificate_key /etc/ssl/private/conductor.example.com.key;

    # Must stay above 3x CONDUCTOR_REALTIME_HEARTBEAT_SECONDS, or nginx closes
    # idle-but-healthy streams itself. Buffering breaks SSE delivery.
    location /api/v1/realtime/events {
        proxy_pass http://conductor;
        proxy_http_version 1.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 75s;
    }

    # REST API and the SPA Conductor serves itself.
    location / {
        proxy_pass http://conductor;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
