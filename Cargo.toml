[workspace]
resolver = "2"
members = [
    "crates/conductor-domain",
    "crates/conductor-storage",
    "crates/conductor-auth",
    "crates/conductor-server",
]
default-members = ["crates/conductor-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["MorphAI Lab"]
repository = "https://github.com/morphai-lab/evo-conductor"

[workspace.dependencies]
conductor-domain = { path = "crates/conductor-domain" }
conductor-storage = { path = "crates/conductor-storage" }
conductor-auth = { path = "crates/conductor-auth" }

anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
jsonwebtoken = "9"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "any", "sqlite", "postgres", "mysql", "chrono", "uuid"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
dashmap = "6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
